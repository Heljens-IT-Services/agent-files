name: Epic
description: Larger product or architecture initiative that groups stories and tasks
title: "[Epic]: "
labels:
  - epic
body:
  - type: textarea
    id: goal
    attributes:
      label: Ziel
      description: What larger outcome should this epic achieve?
      placeholder: Describe the product, technical, or architectural goal.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Kontext
      description: Why is this epic needed and what area of Building Intelligence does it affect?
      placeholder: Explain background, motivation, affected modules, and existing decisions.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Umfang
      description: What belongs to this epic?
      placeholder: |
        - Included area 1
        - Included area 2
        - Included area 3
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Vorgesehene Stories oder Teilbereiche
      description: Which stories or workstreams are expected below this epic?
      placeholder: |
        - Story or area 1
        - Story or area 2
        - Story or area 3
    validations:
      required: false
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Akzeptanzkriterien
      description: How can we verify that this epic is complete?
      placeholder: |
        - [ ] The relevant stories are implemented or explicitly split out.
        - [ ] The intended user or architecture outcome is achieved.
        - [ ] Open follow-up work is documented.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Hinweise
      description: Dependencies, risks, constraints, or links to related issues.
    validations:
      required: false
