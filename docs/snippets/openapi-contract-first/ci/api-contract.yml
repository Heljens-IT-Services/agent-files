# Ausschnitt: Der erzeugte Code muss dem Vertrag entsprechen, und das Backend muss ihn vollständig implementieren.
name: api-contract

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Abhängigkeiten installieren
        working-directory: app/frontend
        run: npm ci
      # Neu erzeugter Code muss der committeten Fassung entsprechen, ohne neue oder fehlende Dateien.
      - name: Erzeugten Code prüfen
        working-directory: app/frontend
        run: npm run api:check
      # Abstrakte Controller-Methoden erzwingen beim Build, dass jede Operation implementiert ist.
      - name: Backend bauen
        run: dotnet build --nologo
