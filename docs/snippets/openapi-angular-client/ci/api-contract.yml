# Ausschnitt: beide Drift-Prüfungen müssen in der CI laufen.
name: api-contract

on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: app/frontend/.nvmrc
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - name: Abhängigkeiten installieren
        working-directory: app/frontend
        run: npm ci
      # Backend-Build erzeugt contracts/api.json; Abweichung zur committeten Fassung schlägt fehl.
      - name: API-Vertrag prüfen
        working-directory: app/frontend
        run: npm run api:contract:check
      # Neu erzeugter Client muss der committeten Fassung entsprechen.
      - name: API-Client prüfen
        working-directory: app/frontend
        run: npm run api:client:check
