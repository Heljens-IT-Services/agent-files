version: 2
updates:
  # Einzige Abhängigkeitsquelle des Repositorys: die Actions des Workflows docs-lint.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 3
